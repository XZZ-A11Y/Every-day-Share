<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>半盏潮汐 · 文件资料库</title>
<style>
:root{
  --bg:#0b1220; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.1);
  --text:#e8eefc; --dim:#93a3c4; --a1:#4fd1c5; --a2:#7aa2ff;
}
body.light{
  --bg:#f4f7fd; --card:#fff; --line:rgba(20,40,80,.12);
  --text:#16233d; --dim:#64749a; --a1:#0d9488; --a2:#3b6cf6;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text); min-height:100vh;
  font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1;
  background:radial-gradient(900px 500px at 10% -10%,rgba(79,209,197,.22),transparent 60%),
             radial-gradient(800px 450px at 90% 0%,rgba(122,162,255,.22),transparent 60%);
}
.wrap{max-width:1100px; margin:0 auto; padding:26px 18px 60px}
header{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.logo{font-size:30px; width:52px; height:52px; display:grid; place-items:center;
  background:var(--card); border:1px solid var(--line); border-radius:15px}
h1{margin:0; font-size:20px}
.sub{margin:3px 0 0; font-size:13px; color:var(--dim)}
.spacer{flex:1}
button,select,input{font:inherit; color:var(--text)}
.btn{border:1px solid var(--line); background:var(--card); padding:7px 13px;
  border-radius:10px; cursor:pointer; font-size:13px; text-decoration:none;
  display:inline-flex; align-items:center; gap:5px}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.pri{background:linear-gradient(135deg,var(--a1),var(--a2)); color:#06121f;
  border:0; font-weight:600}
.bar{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0}
.bar input,.bar select{padding:9px 12px; border-radius:11px; border:1px solid var(--line);
  background:var(--card); outline:0}
.bar input{flex:1; min-width:180px}
.stats{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; font-size:12px; color:var(--dim)}
.stat{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 12px}
.stat b{color:var(--text); font-size:14px; margin-left:4px}
.tabs{display:flex; gap:7px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px}
.tab{flex:none; padding:7px 13px; border-radius:99px; cursor:pointer; font-size:13px;
  border:1px solid var(--line); background:var(--card); color:var(--dim)}
.tab.on{background:linear-gradient(135deg,var(--a1),var(--a2)); color:#06121f;
  border:0; font-weight:600}
.sec{display:flex; align-items:center; gap:10px; margin:20px 0 10px; font-weight:600}
.sec i{flex:1; height:1px; background:var(--line)}
.grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card); border:1px solid var(--line); border-radius:15px;
  padding:14px; display:flex; flex-direction:column; gap:8px}
.card:hover{border-color:var(--a1)}
.nm{font-weight:600; word-break:break-all; display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden}
.ds{font-size:12px; color:var(--dim); display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden}
.tags{display:flex; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--dim)}
.tag{background:rgba(122,162,255,.14); padding:2px 7px; border-radius:6px}
.tag.m{background:rgba(79,209,197,.18)}
.acts{display:flex; gap:7px; flex-wrap:wrap; margin-top:auto}
.parts{display:none; flex-direction:column; gap:5px; font-size:12px}
.parts.on{display:flex}
.parts a{color:var(--a2); text-decoration:none; word-break:break-all}
.empty{text-align:center; padding:60px 20px; color:var(--dim)}
.modal{position:fixed; inset:0; background:rgba(4,10,22,.7); display:grid; place-items:center;
  z-index:50; padding:18px}
.modal[hidden]{display:none}
.box{width:min(660px,100%); background:var(--bg); border:1px solid var(--line);
  border-radius:16px; padding:18px}
.qr{background:#fff; border-radius:12px; width:200px; height:200px; padding:8px;
  display:grid; place-items:center; flex:none}
.qr img,.qr canvas{width:100%!important; height:100%!important}
.row{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px}
.col{flex:1 1 220px; display:flex; flex-direction:column; gap:9px}
.inp{width:100%; padding:7px 9px; border-radius:8px; font-size:12px; border:1px solid var(--line);
  background:var(--card); word-break:break-all}
.toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:var(--card);
  border:1px solid var(--line); padding:9px 16px; border-radius:99px; font-size:13px; z-index:99}
.toast[hidden]{display:none}
footer{text-align:center; color:var(--dim); font-size:12px; margin-top:30px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">🌊</div>
  <div>
    <h1 id="tt">半盏潮汐 · 文件资料库</h1>
    <p class="sub" id="sb">GitHub Releases 驱动 · 自动分类 · 可下载 / 扫码 / 复制链接</p>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="setBtn">⚙ 仓库</button>
  <button class="btn" id="themeBtn">🌓</button>
</header>

<div class="bar">
  <input id="kw" type="search" placeholder="搜索文件名 / 描述 / 标签…">
  <select id="sort">
    <option value="time">最新优先</option>
    <option value="name">名称 A→Z</option>
    <option value="size">体积大→小</option>
    <option value="hot">下载最多</option>
  </select>
</div>

<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<main id="list"></main>
<footer id="foot"></footer>
</div>

<div class="modal" id="qrM" hidden>
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0;font-size:16px">扫码下载</h3>
      <button class="btn" id="qrX">✕</button>
    </div>
    <div class="row">
      <div class="qr" id="qrBox"><span style="color:#334">生成中…</span></div>
      <div class="col">
        <b id="qrN" style="font-size:14px;word-break:break-all"></b>
        <span id="qrM2" style="font-size:12px;color:var(--dim)"></span>
        <input class="inp" id="qrL" readonly>
        <div style="display:flex;gap:7px">
          <button class="btn pri" id="qrC">复制链接</button>
          <button class="btn" id="qrD" disabled>保存图片</button>
        </div>
        <div id="qrP" style="display:flex;flex-direction:column;gap:4px;max-height:130px;overflow:auto"></div>
      </div>
    </div>
  </div>
</div>

<!-- 仓库设置 -->
<div class="modal" id="setM" hidden>
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0;font-size:16px">设置</h3>
      <button class="btn" id="setX">✕</button>
    </div>
    <div class="col" style="margin-top:12px">
      <span style="font-size:12px;color:var(--dim)">仓库（用户名/仓库名）</span>
      <input class="inp" id="repoI" placeholder="例如 octocat/Hello-World">
      <span style="font-size:12px;color:var(--dim)">
        Token（可选）：公开仓库可留空；填 Personal Access Token 可把 API 限额从 60 次/小时提到 5000 次/小时，
        也能读私有仓库。只存在本机浏览器，不会上传。
      </span>
      <input class="inp" id="tokI" type="password" placeholder="ghp_xxx（可留空）">
      <div style="display:flex;gap:7px">
        <button class="btn pri" id="setS">保存并刷新</button>
        <button class="btn" id="setR">重新加载数据</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ============ 只需改这里 ============ */
const CONFIG = {
  repo: '',          // 留空：自动从网址推断（github.io/仓库名/）。也可直接写 "用户名/仓库名"
  categories: [      // 按顺序匹配文件名，命中即用该分类
    { n:'电子书',  i:'📚', m:/(\.epub$|\.mobi$|\.azw3$|电子书|ebook)/i },
    { n:'文档资料', i:'📄', m:/(\.pdf$|\.docx?$|\.pptx?$|\.xlsx?$|\.md$|文档|资料|手册)/i },
    { n:'设计素材', i:'🎨', m:/(\.psd$|\.ai$|\.sketch$|\.fig$|素材|设计)/i },
    { n:'图片图集', i:'🖼️', m:/(\.png$|\.jpe?g$|\.webp$|\.svg$|图集|壁纸)/i },
    { n:'视频课程', i:'🎬', m:/(\.mp4$|\.mkv$|\.mov$|\.avi$|视频|课程|录播)/i },
    { n:'音频音乐', i:'🎧', m:/(\.mp3$|\.flac$|\.wav$|\.m4a$|音频|音乐|播客)/i },
    { n:'安装包',  i:'💿', m:/(\.exe$|\.msi$|\.dmg$|\.pkg$|\.apk$|setup|安装包)/i },
    { n:'压缩包',  i:'🗜️', m:/(\.zip$|\.rar$|7z$|\.tar\.gz$)/i },
    { n:'数据集',  i:'🧬', m:/(\.csv$|\.parquet$|\.jsonl$|dataset|数据集)/i }
  ],
  fallback: '其他资源'
};
/* ============ 配置结束 ============ */

const $ = s => document.querySelector(s);
let items = [], cat = '__all__', kw = '';

/* ---- 仓库推断 ---- */
function guessRepo(){
  if (CONFIG.repo) return CONFIG.repo;
  const p = location.pathname.split('/').filter(Boolean);
  if (location.hostname.endsWith('.github.io') && p.length)
    return location.hostname.replace('.github.io','') + '/' + p[0];
  return '';
}
let REPO = localStorage.getItem('vault_repo') || guessRepo();
let TOKEN = localStorage.getItem('vault_token') || '';

/* ---- 数据 ---- */
async function gh(path){
  const h = { Accept:'application/vnd.github+json' };
  if (TOKEN) h.Authorization = 'Bearer ' + TOKEN;
  const r = await fetch('https://api.github.com' + path, { headers:h });
  if (!r.ok) throw new Error('GitHub API ' + r.status + '（若 403 多为访问频率超限，可填 Token）');
  return r.json();
}
const size = n => {
  const u=['B','KB','MB','GB','TB']; let i=0; n=+n||0;
  while(n>=1024 && i<4){ n/=1024; i++; }
  return (i?n.toFixed(2):n.toFixed(0))+' '+u[i];
};
function classify(name, meta){
  if (meta && meta.category) return meta.category;
  for (const c of CONFIG.categories) if (c.m.test(name)) return c.n;
  const e = (name.split('.').pop()||'').toLowerCase();
  const map = {epub:'电子书',mobi:'电子书',azw3:'电子书',pdf:'文档资料',doc:'文档资料',docx:'文档资料',
    xls:'文档资料',xlsx:'文档资料',ppt:'文档资料',pptx:'文档资料',md:'文档资料',txt:'文档资料',
    psd:'设计素材',ai:'设计素材',sketch:'设计素材',fig:'设计素材',
    png:'图片图集',jpg:'图片图集',jpeg:'图片图集',webp:'图片图集',svg:'图片图集',
    mp4:'视频课程',mkv:'视频课程',mov:'视频课程',avi:'视频课程',
    mp3:'音频音乐',flac:'音频音乐',wav:'音频音乐',m4a:'音频音乐',
    exe:'安装包',msi:'安装包',dmg:'安装包',apk:'安装包',
    zip:'压缩包',rar:'压缩包',csv:'数据集',parquet:'数据集'};
  return map[e] || CONFIG.fallback;
}
function parseMeta(body){
  const o = {}; if(!body) return o;
  const m = body.match(/^\s*---\s*\n([\s\S]*?)\n\s*---\s*\n?/);
  if (m) m[1].split('\n').forEach(l => { const k=l.indexOf(':'); if(k>0) o[l.slice(0,k).trim().toLowerCase()] = l.slice(k+1).trim(); });
  o._desc = m ? body.slice(m[0].length).trim().slice(0,200) : body.slice(0,200);
  return o;
}
/* 分卷：xxx.part000 / xxx.z01 / xxx.7z.002 → 合并成一条 */
const PART = [/^(.+?)\.part(\d{1,3})$/i, /^(.+?)\.z(\d{2,3})$/i, /^(.+?)\.7z\.(\d{2,3})$/i];
function merge(parts){
  const g={}, rest=[];
  parts.forEach(it=>{
    for(const re of PART){ const m=it.name.match(re); if(m){ (g[m[1]]=g[m[1]]||[]).push([+m[2],it]); return; } }
    rest.push(it);
  });
  const out=[...rest];
  for(const base in g){
    const ps=g[base].sort((a,b)=>a[0]-b[0]).map(x=>x[1]), o={...ps[0]};
    o.name=base; o.size=ps.reduce((s,x)=>s+x.size,0); o.size_h=size(o.size);
    o.dl=Math.max(...ps.map(x=>x.dl)); o.multi=ps.map(p=>({name:p.name,url:p.url,sz:p.size_h}));
    out.push(o);
  }
  return out;
}
async function load(){
  if (!REPO) { REPO = prompt('请输入仓库（用户名/仓库名）：') || ''; if(REPO) localStorage.setItem('vault_repo',REPO); }
  if (!REPO) { $('#list').innerHTML='<div class="empty">未设置仓库，点右上角 ⚙ 填写</div>'; return; }
  $('#list').innerHTML = '<div class="empty">正在读取 ' + REPO + ' 的 Releases…</div>';
  try{
    let rels=[], page=1;
    while(page<=10){
      const d = await gh('/repos/'+REPO+'/releases?per_page=100&page='+page);
      rels = rels.concat(d); if(d.length<100) break; page++;
    }
    const tmp=[];
    rels.forEach(r=>{
      if(r.draft) return;
      const meta = parseMeta(r.body||'');
      (r.assets||[]).forEach(a=>{
        if(a.state!=='uploaded') return;
        tmp.push({name:a.name, cat:classify(a.name,meta), size:a.size, size_h:size(a.size),
          url:a.browser_download_url, dl:a.download_count||0, up:a.updated_at||a.created_at||'',
          tag:r.tag_name||'', rel:r.name||r.tag_name||'', rel_u:r.html_url||'',
          desc:meta.desc||meta._desc||''});
      });
    });
    items = merge(tmp);
    render();
  }catch(e){
    $('#list').innerHTML = '<div class="empty">读取失败：'+e.message+'<br><br>点右上角 ⚙ 检查仓库名或填写 Token</div>';
  }
}

/* ---- 渲染 ---- */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shown(){
  let a = items;
  if(cat!=='__all__') a = a.filter(i=>i.cat===cat);
  if(kw){ const k=kw.toLowerCase();
    a = a.filter(i=>(i.name+' '+i.desc+' '+i.tag+' '+i.rel).toLowerCase().includes(k)); }
  const srt = { time:(x,y)=>String(y.up).localeCompare(String(x.up)),
    name:(x,y)=>x.name.localeCompare(y.name,'zh'), size:(x,y)=>y.size-x.size, hot:(x,y)=>y.dl-x.dl };
  return a.slice().sort(srt[ $('#sort').value ]);
}
function card(i){
  return '<div class="card" data-n="'+esc(i.name)+'"><div class="nm">'+esc(i.name)+'</div>'
    + (i.desc?'<div class="ds">'+esc(i.desc)+'</div>':'')
    + '<div class="tags"><span class="tag">'+esc(i.size_h)+'</span>'
    + '<span class="tag">'+esc(i.up.slice(0,10))+'</span>'
    + (i.dl?'<span class="tag">↓'+i.dl+'</span>':'')
    + (i.tag?'<span class="tag">'+esc(i.tag)+'</span>':'')
    + (i.multi?'<span class="tag m">分卷 '+i.multi.length+'</span>':'')+'</div>'
    + (i.multi?'<div class="parts">'+i.multi.map(p=>
        '<div><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.name)+'</a> · '+esc(p.sz)+'</div>').join('')+'</div>':'')
    + '<div class="acts"><a class="btn pri" href="'+esc(i.url)+'" target="_blank" rel="noopener">⬇ 下载</a>'
    + '<button class="btn" data-a="qr">📱 二维码</button>'
    + '<button class="btn" data-a="copy">🔗 复制链接</button>'
    + (i.multi?'<button class="btn" data-a="parts">📚 分卷</button>':'')
    + (i.rel_u?'<a class="btn" href="'+esc(i.rel_u)+'" target="_blank" rel="noopener">Release</a>':'')
    + '</div></div>';
}
function render(){
  const a = shown(), g = {};
  a.forEach(i=>(g[i.cat]=g[i.cat]||[]).push(i));
  const tot = items.reduce((s,i)=>s+i.size,0), dls = items.reduce((s,i)=>s+i.dl,0);
  $('#stats').innerHTML = [['文件',items.length],['分类',new Set(items.map(i=>i.cat)).size],
    ['总体积',size(tot)],['总下载',dls]].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')
    + '<div class="stat">仓库<b>'+esc(REPO)+'</b></div>';

  const tab = (k,label,cnt,icon) => '<div class="tab'+(cat===k?' on':'')+'" data-c="'+esc(k)+'">'
    + icon+' '+label+' '+cnt+'</div>';
  $('#tabs').innerHTML = tab('__all__','全部',items.length,'🗂️')
    + Object.keys(g).map(k=>{
        const c = CONFIG.categories.find(x=>x.n===k);
        return tab(k, esc(k), g[k].length, c?c.i:'📦');
      }).join('');
  $('#tabs').querySelectorAll('.tab').forEach(t=>
    t.onclick = () => { cat = t.dataset.c; render(); });

  $('#list').innerHTML = a.length ? Object.keys(g).map(k=>{
      const c = CONFIG.categories.find(x=>x.n===k);
      return '<div class="sec">'+(c?c.i:'📦')+' '+esc(k)+'<i></i><span style="font-size:12px;color:var(--dim)">'+g[k].length+' 个</span></div>'
        + '<div class="grid">'+g[k].map(card).join('')+'</div>';
    }).join('') : '<div class="empty">没有匹配的文件 🌊</div>';
  $('#foot').textContent = '数据来自 GitHub Releases · 仓库 ' + REPO + ' · 每次打开实时读取';
}

/* ---- 交互 ---- */
let tt;
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2000); }
function copy(text){
  const ok=()=>toast('链接已复制 ✅');
  if(navigator.clipboard && isSecureContext) navigator.clipboard.writeText(text).then(ok).catch(fb);
  else fb();
  function fb(){ const t=document.createElement('textarea'); t.value=text; t.style.opacity=0;
    document.body.append(t); t.select(); try{document.execCommand('copy');ok();}catch(e){toast('复制失败');} t.remove(); }
}
let qrLib=null;
function qrJs(){ if(qrLib) return qrLib;
  const cdns=['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',
    'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js',
    'https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js'];
  return qrLib = new Promise(res=>{ if(window.QRCode) return res(1); let i=0;
    (function nx(){ if(i>=cdns.length) return res(0);
      const s=document.createElement('script'); s.src=cdns[i++];
      s.onload=()=>res(!!window.QRCode); s.onerror=nx; document.head.append(s); })(); });
}
async function qr(name){
  const it = items.find(x=>x.name===name); if(!it) return;
  $('#qrM').hidden=false; $('#qrN').textContent=it.name;
  $('#qrM2').textContent = it.size_h + ' · ' + it.up.slice(0,10) + ' · ' + it.cat;
  $('#qrL').value = it.url; $('#qrD').disabled = true;
  $('#qrP').innerHTML = it.multi ? '<span style="font-size:12px;color:var(--dim)">分卷直链：</span>'
    + it.multi.map(p=>'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.name)+' · '+esc(p.sz)+'</a>').join('') : '';
  const box=$('#qrBox'); box.innerHTML='<span style="color:#334">生成中…</span>';
  if(await qrJs() && window.QRCode){
    try{ box.innerHTML=''; const d=document.createElement('div'); box.append(d);
      new QRCode(d,{text:it.url,width:184,height:184,colorDark:'#0b1220',colorLight:'#fff'});
      setTimeout(()=>{ const c=d.querySelector('canvas')||d.querySelector('img');
        if(c){ $('#qrD').disabled=false; $('#qrD').onclick=()=>save(c,it.name); } },200); return;
    }catch(e){}
  }
  const im=new Image();
  im.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data='+encodeURIComponent(it.url);
  im.onload=()=>{ box.innerHTML=''; box.append(im); $('#qrD').disabled=false; $('#qrD').onclick=()=>save(im,it.name); };
  im.onerror=()=>{ box.innerHTML='<span style="color:#334;text-align:center">二维码库加载失败<br>可直接复制链接</span>'; };
}
function save(el,name){
  try{ let u; if(el.tagName==='CANVAS') u=el.toDataURL('image/png');
    else { const c=document.createElement('canvas'); c.width=c.height=200; c.getContext('2d').drawImage(el,0,0,200,200); u=c.toDataURL('image/png'); }
    const a=document.createElement('a'); a.href=u; a.download=name.replace(/[\\/:*?"<>|]/g,'_').slice(0,60)+'.png'; a.click(); toast('已保存');
  }catch(e){ toast('保存失败，可截图'); }
}

/* 卡片按钮事件委托 */
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const name = b.closest('.card').dataset.n;
  const it = items.find(x => x.name === name); if(!it) return;
  const a = b.dataset.a;
  if(a==='copy') copy(it.url);
  if(a==='qr') qr(it.name);
  if(a==='parts') b.closest('.card').querySelector('.parts').classList.toggle('on');
});

$('#kw').oninput = e => { kw=e.target.value.trim(); render(); };
$('#sort').onchange = render;
$('#themeBtn').onclick = () => document.body.classList.toggle('light');
$('#qrX').onclick = () => $('#qrM').hidden = true;
$('#qrM').onclick = e => { if(e.target.id==='qrM') $('#qrM').hidden=true; };
$('#setBtn').onclick = () => { $('#repoI').value=REPO; $('#tokI').value=TOKEN; $('#setM').hidden=false; };
$('#setX').onclick = () => $('#setM').hidden = true;
$('#setM').onclick = e => { if(e.target.id==='setM') $('#setM').hidden=true; };
$('#setS').onclick = () => { REPO=$('#repoI').value.trim(); TOKEN=$('#tokI').value.trim();
  localStorage.setItem('vault_repo',REPO); localStorage.setItem('vault_token',TOKEN);
  $('#setM').hidden=true; load(); };
$('#setR').onclick = () => { $('#setM').hidden=true; load(); };
$('#qrC').onclick = () => copy($('#qrL').value);

load();
</script>
