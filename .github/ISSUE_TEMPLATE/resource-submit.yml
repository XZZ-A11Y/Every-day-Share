name: 资源投稿
description: 提交你想添加到资源库的任何内容
title: "[投稿] "
labels: ["resource-request"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        📚 欢迎投稿！任何有价值的资源都可以提交——文档、工具、音视频、学习资料、代码片段、书摘、链接合集等。审核通过后会被加入下一期发布。

  - type: input
    id: submitter
    attributes:
      label: 昵称
      description: 选填，留空显示为匿名
      placeholder: 你的昵称

  - type: input
    id: resource_title
    attributes:
      label: 资源标题
      description: 一句话概括
      placeholder: 例如：Python 数据分析速查表 / 免费图标库合集 / 某篇好文
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: 分类
      description: 你自己填写分类，方便管理员归档
      placeholder: 例如：学习资料 / 工具推荐 / 音视频 / 代码 / 其他

  - type: textarea
    id: resource_content
    attributes:
      label: 资源内容
      description: 直接粘贴内容，或填写详细描述、下载链接、使用方法等
      placeholder: |
        请在此粘贴内容或详细描述：
        - 是什么资源
        - 有什么用
        - 怎么用
        - 相关链接
    validations:
      required: true

  - type: input
    id: file_url
    attributes:
      label: 文件/下载链接
      description: 如果有网盘链接、下载地址等，填在这里（选填）
      placeholder: https://...

  - type: input
    id: source
    attributes:
      label: 来源 / 原作者
      description: 如有出处请注明，尊重版权（选填）
      placeholder: 原作者 / 网站名 / 书籍名

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认此资源适合加入公开资源库，且无版权纠纷
          required: true
