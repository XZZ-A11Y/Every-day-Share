name: 资源投稿
description: 提交资源（关闭即发布）
title: "[投稿] "
labels: ["resource-request"]
body:
  - type: input
    id: submitter
    attributes:
      label: 贡献者昵称
      placeholder: 你的昵称
    validations:
      required: true
  - type: input
    id: resource_title
    attributes:
      label: 资源标题
      placeholder: 例如：四级高频词汇表
    validations:
      required: true
  - type: textarea
    id: resource_content
    attributes:
      label: 资源内容
      placeholder: 描述、链接等
    validations:
      required: true
  - type: dropdown
    id: is_paid
    attributes:
      label: 是否收费
      options: ["免费", "收费"]
    validations:
      required: true
  - type: input
    id: payment_receiver
    attributes:
      label: 收费归谁（收费才填）
      placeholder: 归投稿人本人
