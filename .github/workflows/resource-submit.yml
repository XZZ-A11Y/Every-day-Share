name: Resource Submit

on:
  workflow_dispatch:
    inputs:
      resource_title:
        description: "资源标题"
        required: true
        type: string
      resource_content:
        description: "资源内容"
        required: true
        type: string
      category:
        description: "分类"
        required: false
        type: string
      submitter:
        description: "投稿人"
        required: false
        type: string
        default: "匿名用户"
      file_url:
        description: "文件链接"
        required: false
        type: string
      source:
        description: "来源"
        required: false
        type: string

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Resource Issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.inputs.resource_title;
            const content = context.payload.inputs.resource_content;
            const category = context.payload.inputs.category || '未分类';
            const submitter = context.payload.inputs.submitter;
            const fileUrl = context.payload.inputs.file_url;
            const source = context.payload.inputs.source;

            const body = `## 📚 资源投稿

            | 字段 | 内容 |
            |------|------|
            | 投稿人 | ${submitter} |
            | 分类 | ${category} |
            | 来源 | ${source || '未提供'} |
            | 文件链接 | ${fileUrl || '无'} |

            ---

            ### 资源内容

            ${content}

            ---

            🔔 管理员：审核通过后请打上 \`approved\` 标签并关闭此 Issue，将自动加入下一期发布。`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[投稿] ${title}`,
              body: body,
              labels: ['resource-request', 'needs-triage']
            });

