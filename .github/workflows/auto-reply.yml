name: Auto Reply to Submission

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  reply:
    if: contains(github.event.issue.labels.*.name, 'resource-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ 已收到你的投稿！管理员审核通过后会加入下一期资源发布。感谢贡献 🎉'
            });

