name: 关闭即发布（普通）

on:
  issues:
    types: [closed]

jobs:
  publish:
    if: "!contains(github.event.issue.labels.*.name, 'resource-request')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 创建 Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: 发布 #${{ github.event.issue.number }}
          body: |
            来自：#${{ github.event.issue.number }}
            标题：${{ github.event.issue.title }}
            内容：
            ${{ github.event.issue.body }}
          draft: false
          prerelease: false
