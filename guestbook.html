<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板</title>
<style>
  :root{
    --bg: #f5f0e8;
    --card: #fdfaf5;
    --text: #2f2b26;
    --muted: #9a948a;
    --me: #95ec69;
    --other: #ffffff;
    --border: #e8e0d2;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html,body{ height: 100%; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page{
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* 顶部 */
  .header{ margin-bottom: 28px; }
  .header h1{
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .header p{
    margin-top: 6px;
    font-size: 14px;
    color: var(--muted);
  }

  /* 评论区卡片 */
  .comments{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }

  /* ============ QQ 气泡重写 ============ */
  /* 让 giscus 内部的评论列表变成上下流式气泡 */
  .giscus,
  .giscus-frame{ width: 100%; border: none; }

  /* 每条评论条目 */
  .giscus .gt-comment,
  .giscus .gsc-comment-box,
  .giscus [class*="comment"]{
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  /* 单条评论：头像 + 气泡 的横排 */
  .giscus .gt-comment-content,
  .giscus .gsc-comment{
    display: flex !important;
    align-items: flex-start;
    gap: 10px;
    margin: 14px 0 !important;
  }

  /* 头像 */
  .giscus .gt-comment-avatar,
  .giscus .gsc-comment-author-avatar{
    width: 38px !important;
    height: 38px !important;
    border-radius: 50% !important;
    flex-shrink: 0;
    margin: 0 !important;
  }

  /* 昵称 */
  .giscus .gt-comment-username,
  .giscus .gsc-comment-author-name{
    font-size: 12px !important;
    color: var(--muted) !important;
    font-weight: 500 !important;
  }

  /* 气泡本体 */
  .giscus .gt-comment-body,
  .giscus .gsc-comment-content{
    background: var(--other) !important;
    border: 1px solid var(--border) !important;
    border-radius: 4px 14px 14px 14px !important;
    padding: 9px 13px !important;
    font-size: 15px !important;
    line-height: 1.6 !important;
    max-width: 75% !important;
    box-shadow: none !important;
    margin: 4px 0 0 !important;
  }

  /* 自己的消息（作者/管理员）→ 靠右 + 绿底 */
  .giscus .gt-comment.is-author .gt-comment-body,
  .giscus .gsc-comment.is-author .gsc-comment-content,
  .giscus [class*="is-author"] .gt-comment-body,
  .giscus [class*="is-author"] .gsc-comment-content,
  .giscus .gt-comment.is-admin .gt-comment-body,
  .giscus [class*="is-admin"] .gt-comment-body{
    background: var(--me) !important;
    border-color: var(--me) !important;
    border-radius: 14px 4px 14px 14px !important;
    margin-left: auto !important;
  }

  /* 自己发言时，整行反转：头像在右 */
  .giscus .gt-comment.is-author,
  .giscus [class*="is-author"],
  .giscus .gt-comment.is-admin,
  .giscus [class*="is-admin"]{
    flex-direction: row-reverse !important;
  }

  /* 时间 */
  .giscus .gt-comment-date,
  .giscus .gsc-comment-date{
    font-size: 11px !important;
    color: var(--muted) !important;
    margin-top: 2px !important;
  }

  /* 去掉 giscus 默认分割线 */
  .giscus hr,
  .giscus .gt-comment-separator{ display: none !important; }

  /* 输入框区域保持简洁 */
  .giscus .gt-header,
  .giscus .gsc-comment-box{
    border-top: 1px solid var(--border) !important;
    padding-top: 14px !important;
    margin-top: 10px !important;
  }
  .giscus textarea{
    background: var(--bg) !important;
    border: 1px solid var(--border) !important;
    border-radius: 10px !important;
    color: var(--text) !important;
  }

  /* 加载占位 */
  .loading{
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 30px 0;
  }

  footer{
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
  footer a{ color: inherit; text-decoration: none; }
  footer a:hover{ text-decoration: underline; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>💬 留言板</h1>
    <p>畅所欲言 · 留言即表示同意公开发布</p>
  </div>

  <div class="comments">
    <div class="loading">正在加载评论…</div>
    <div class="giscus"></div>
  </div>

  <footer>
    Powered by <a href="https://giscus.app" target="_blank" rel="noopener">giscus</a>
    ·
    <a href="https://github.com/XZZ-A11Y/Every-day-Share/discussions" target="_blank" rel="noopener">查看全部</a>
  </footer>
</div>

<script src="https://giscus.app/client.js"
        data-repo="XZZ-A11Y/Every-day-Share"
        data-repo-id="R_kgDOT8c-6w"
        data-category="Discussion——G"
        data-category-id="DIC_kwDOT8c-684DEWIr"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="light"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
</script>

<script>
  // 加载完成后去掉占位文字
  document.querySelector('.giscus').addEventListener('load', function(){
    document.querySelector('.loading').style.display = 'none';
  }, true);
</script>
</body>
</html>
